[package]
name = "tauri-cblite-example"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_cblite_example_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop: use the Enterprise CBL native library (encryption + predictive queries).
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-cblite = {  git = "https://github.com/ldoguin/tauri-plugin-cblite", features = ["enterprise"] }

# Android: CBL is handled entirely in Kotlin — no native library needed.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-cblite = {  git = "https://github.com/ldoguin/tauri-plugin-cblite" }

